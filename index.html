<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REFLEX ARCADE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <header>
      <h1>REFLEX ARCADE</h1>
      <p class="subtitle">Neural response speed & consistency benchmark.</p>
    </header>

    <!-- Round Progress Bar -->
    <div class="progress-bar">
      <span class="p-step" id="p1"></span>
      <span class="p-step" id="p2"></span>
      <span class="p-step" id="p3"></span>
      <span class="p-step" id="p4"></span>
      <span class="p-step" id="p5"></span>
    </div>

    <!-- Interactive Game Box -->
    <div id="target-box" class="target-box state-wait">
      <div id="target-text" class="target-text">CLICK TO START (5 ROUNDS)</div>
    </div>

    <!-- Rank Display -->
    <div class="rank-card">
      <span class="stat-label">CURRENT NEURAL RANK</span>
      <span id="rank-value" class="rank-text">UNRANKED</span>
    </div>

    <!-- Stats Dashboard -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">5-ROUND AVG</span>
        <span id="avg-score" class="stat-value">-- ms</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">PERSONAL BEST</span>
        <span id="best-score" class="stat-value">-- ms</span>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
