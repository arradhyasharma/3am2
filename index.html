<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>Reflex Test</title>
</head>
<body>

  <main class="container">
    <header>
      <h1>REFLEX TESTER</h1>
      <p class="subtitle">Measure neural response time in milliseconds.</p>
    </header>

    <div class="progress-bar">
      <span class="p-step" id="p1"></span>
      <span class="p-step" id="p2"></span>
      <span class="p-step" id="p3"></span>
      <span class="p-step" id="p4"></span>
      <span class="p-step" id="p5"></span>
      </div>
    <div id="target-box" class="target-box state-wait">
      <div id="target-text" class="target-text">CLICK TO START (5 ROUNDS)</div>
    </div>

    <div class="rank-card">
      <span class="stat-label">Current Neural Rank</span>
      <span id="target-text" class="rank-text">UNRANKED</span>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">5-ROUND AVG</span>
        <span id="avg-score" class="stat-value">-- ms</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">PERSONAL BEST</span>
        <span id="best-score" class="stat-value">-- ms</span>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
